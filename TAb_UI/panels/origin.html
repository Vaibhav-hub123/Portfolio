<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="/TAb_UI/css_for_panels/origin.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400..900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="origin-panel">
      <svg class="hud" viewBox="0 0 1000 600" preserveAspectRatio="none">
        <path d="M10 80 L10 10 L120 10" />

        <path d="M990 520 L990 590 L880 590" />

        <!-- 21: Vertical tick ruler (side decoration) -->
        <g class="screen-decor" transform="translate(10,200)">
          <line x1="0" y1="0" x2="0" y2="200" />
          <line x1="0" y1="0" x2="14" y2="0" />
          <line x1="0" y1="40" x2="8" y2="40" />
          <line x1="0" y1="80" x2="10" y2="80" />
          <line x1="0" y1="120" x2="8" y2="120" />
          <line x1="0" y1="160" x2="10" y2="160" />
          <line x1="0" y1="200" x2="14" y2="200" />
        </g>

        <g class="screen-decor" transform="translate(10, 500)">
          <path d="M0 0 L100 0 L150 -50 L 300 -50" />

          <!-- <circle class="circle_line1" cx="305" cy="-50" r="5" /> -->
        </g>
        <g class="screen-decor">
          <path d="M120 100 L260 100 L330 170" />

          <path d="M880 450 L740 450 L670 380" />
        </g>
      </svg>
      <svg
        class="hud-overlay"
        viewBox="0 0 1000 600"
        preserveAspectRatio="xMidYMid meet"
      >
        <g>
          <circle class="circle_line1" cx="256" cy="450" r="6" />
          <circle class="circle_line2" cx="256" cy="450" r="2" />
          <circle class="circle_line1" cx="281" cy="176" r="6" />
          <circle class="circle_line2" cx="281" cy="176" r="2" />
          <circle class="circle_line1" cx="719" cy="374" r="6" />
          <circle class="circle_line2" cx="719" cy="374" r="2" />
          <!-- <circle cx="120" cy="10" r="2"/>
             
            <circle cx="880" cy="590" r="2"/>

            <circle cx="10" cy="80" r="2"/>

            <circle cx="990" cy="520" r="2"/> -->
        </g>
      </svg>

      <div class="content">
        <div class="profile">
          <div class="intro">
            <div class="intro-container">
              <div class="text1">Hello</div>
              <div class="text2">
                <span style="color: white"> I'm</span> Vaibhav Agrahari
              </div>
              
              <p class="text3">
                <span>I’m a developer who enjoys building </span>
                <span>interactive experiences at the </span>
                <span>intersection of design and technology. I </span>
                <span>work with modern web technologies,</span>
                <span> animation, and real-time 3D to create </span>
                <span>interfaces that are both visually engaging</span>
                <span>and technically driven.</span>
              </p>
              <span class="system-cursor">▌</span>
            </div>
          </div>
          <div class="photo-container">
            <div class="photo-box">
              <div class="grid"></div>
              <img class="photo" src="assets/MyPhoto/blue.png" alt="" />
              <img class="photo1" src="assets/MyPhoto/blue.png" alt="" />
            </div>
            <div class="scan-line"></div>
          </div>
          <div class="intro2">
            <p></p>
          </div>
        </div>
      </div>
    </div>
    <script src="/TAb_UI/JS_for_panels/origin.js"></script>
  </body>
</html>
