<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Space Portfolio</title>

    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="overlay.css" />
    <link rel="stylesheet" href="Detector/detector.css" />
    <link rel="stylesheet" href="TAb_UI/css_for_panels/infoPanel.css" />
    <link rel="stylesheet" href="navigation/navigation.css" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/gsap.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400..900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <svg
      id="glassFilters"
      style="position: absolute; width: 0; height: 0; overflow: hidden"
    >
      <defs>
        <filter
          id="glassDistortion"
          x="-20%"
          y="-20%"
          width="140%"
          height="140%"
        >
          <feTurbulence
            type="fractalNoise"
            baseFrequency="0.008 0.03"
            numOctaves="2"
            seed="7"
            result="noise"
          />
          <feGaussianBlur in="noise" stdDeviation="2" result="blurredNoise" />
          <feDisplacementMap
            in="SourceGraphic"
            in2="blurredNoise"
            scale="18"
            xChannelSelector="R"
            yChannelSelector="G"
          />
        </filter>
      </defs>
    </svg>

    <div id="planetHUD">
      <svg id="hud" viewBox="0 0 800 800">
        <defs>
          <filter id="glow">
            <feGaussianBlur stdDeviation="4" result="blur" />

            <feMerge>
              <feMergeNode in="blur" />

              <feMergeNode in="SourceGraphic" />
            </feMerge>
          </filter>
        </defs>

        <!-- ========================= -->
        <!-- OUTER RING -->
        <!-- ========================= -->

        <g id="outerRing" filter="url(#glow)">
          <circle id="outerCircle" cx="400" cy="400" r="250" />
        </g>

        <!-- ========================= -->
        <!-- INNER RING -->
        <!-- ========================= -->

        <g id="innerRing" filter="url(#glow)">
          <circle id="innerCircle" cx="400" cy="400" r="200" />
        </g>

        <!-- ========================= -->
        <!-- SEGMENT RING -->
        <!-- ========================= -->

        <g id="segmentRing">
          <!-- TOP -->

          <path
            class="segment"
            d="M305 170
                    A230 230 0 0 1 495 170"
          />

          <!-- RIGHT -->

          <path
            class="segment"
            d="M630 305
                    A230 230 0 0 1 630 495"
          />

          <!-- BOTTOM -->

          <path
            class="segment"
            d="M495 630
                    A230 230 0 0 1 305 630"
          />

          <!-- LEFT -->

          <path
            class="segment"
            d="M170 495
                    A230 230 0 0 1 170 305"
          />
        </g>

        <!-- ========================= -->
        <!-- INNER SEGMENTS -->
        <!-- ========================= -->

        <g id="innerSegments">
          <path
            class="smallSegment"
            d="M330 220
                    A180 180 0 0 1 470 220"
          />

          <path
            class="smallSegment"
            d="M580 330
                    A180 180 0 0 1 580 470"
          />

          <path
            class="smallSegment"
            d="M470 580
                    A180 180 0 0 1 330 580"
          />

          <path
            class="smallSegment"
            d="M220 470
                    A180 180 0 0 1 220 330"
          />

          <!-- ========================= -->
          <!-- CENTER RINGS -->
          <!-- ========================= -->

          <g id="centerRing" filter="url(#glow)">
            <circle cx="400" cy="400" r="150" class="centerCircle" />

            <circle cx="400" cy="400" r="145" class="centerCircleThin" />
          </g>
        </g>
      </svg>
      <div class="planetLabel">
        <div class="labelTitle"></div>

        <svg class="connector" width="170" height="70">
          <defs>
            <filter
              id="connectorGlow"
              x="-100%"
              y="-100%"
              width="100%"
              height="100%"
            >
              <feGaussianBlur stdDeviation="6" result="blur" />

              <feMerge>
                <feMergeNode in="blur" />

                <feMergeNode in="SourceGraphic" />
              </feMerge>
            </filter>
          </defs>

          <path
            d="M0 10 H80 L120 50 H170"
            class="connectorGlow"
            filter="url(#connectorGlow)"
          />

          <path d="M0 10 H80 L120 50 H170" class="connectorPath" />
        </svg>
      </div>
    </div>

    <div id="overlay">
      <div id="shipFrame">
        <div class="frameBar top"></div>
        <div class="frameBar bottom"></div>
        <div class="frameBar left"></div>
        <div class="frameBar right"></div>
      </div>
      <div id="screenGlass"></div>
      <div class="hudRoot">
        <div id="themePanel">
          <div class="themeHeader">THEMES</div>

          <div class="themeCard" data-theme="blue">
            <div class="themePreview blue"></div>
            <span>Nebula</span>
          </div>

          <div class="themeCard" data-theme="green">
            <div class="themePreview green"></div>
            <span>Emerald</span>
          </div>

          <div class="themeCard" data-theme="red">
            <div class="themePreview red"></div>
            <span>Mars</span>
          </div>
        </div>

        <div class="top-bar">
          <!-- <div class="glassSheen"></div> -->
          <div class="shine top"></div>
          <div class="shine bottom"></div>
          <div class="corner left"></div>
          <div class="corner right"></div>
          <div class="left"></div>
          <div class="right">
            <button><img src="icons/user.svg" class="icons" /></button>
            <button>
              <img src="icons/Setting.svg" id="themeBtn" class="icons" />
            </button>
            <button>☰</button>
          </div>
        </div>

        <svg class="left-arc" viewBox="0 0 300 600">
          <path
            d="M520 240
                    A420 420 0 0 0
                    520 660
                    "
            class="arc-line"
          />
        </svg>

        <div class="roboNavHud">
          <div id="robotAssistant"></div>

          <div id="navigatorHUD">
            <div id="navigatorConnector">
              <svg id="navigatorSVG" viewBox="0 0 900 180">
                <g id="connector">
                  <path
                    id="connectorPath1"
                    d="M20 145
                              L200 145
                              L300 80
                              L310 80"
                  />

                  <path
                    id="connectorPath2"
                    d="M357 80
                              L610 80"
                  />

                  <path
                    id="connectorPath3"
                    d="M657 80
                              L810 80"
                  />

                  <path
                    id="connectorPath4"
                    d="M857 80
                              L870 80"
                  />
                </g>

                <!-- ========================= -->
                <!-- Glow -->
                <!-- ========================= -->
                <defs>
                  <mask id="beamMask">
                    <path
                      id="beamMaskPath"
                      d="
                                      M20 145
                                      L200 145
                                      L300 80
                                      L870 80
                                  "
                      fill="none"
                      stroke="white"
                      stroke-width="18"
                      stroke-linecap="round"
                    />
                  </mask>
                  <linearGradient
                    id="beamGradient"
                    gradientUnits="userSpaceOnUse"
                    x1="20"
                    y1="0"
                    x2="870"
                    y2="0"
                  >
                    <stop offset="0%" stop-color="#3ffcff" stop-opacity=".25" />
                    <stop
                      offset="60%"
                      stop-color="#6affff"
                      stop-opacity=".75"
                    />
                    <stop offset="90%" stop-color="#ffffff" />
                    <stop offset="100%" stop-color="#ffffff" />
                  </linearGradient>
                </defs>
                <g id="connectorGlow" mask="url(#beamMask)">
                  <path
                    d="M20 145
                              L200 145
                              L300 80
                              L310 80"
                  />

                  <path
                    d="M357 80
                              L610 80"
                  />

                  <path
                    d="M657 80
                              L810 80"
                  />

                  <path
                    d="M857 80
                              L870 80"
                  />
                </g>
                <g id="connectorGlow2" mask="url(#beamMask)">
                  <path
                    d="M20 145
                              L200 145
                              L300 80
                              L310 80"
                  />

                  <path
                    d="M357 80
                              L610 80"
                  />

                  <path
                    d="M657 80
                              L810 80"
                  />

                  <path
                    d="M857 80
                              L870 80"
                  />
                </g>
                <g id="connectorCore" mask="url(#beamMask)">
                  <path
                    d="M20 145
                              L200 145
                              L300 80
                              L310 80"
                  />

                  <path
                    d="M357 80
                              L610 80"
                  />

                  <path
                    d="M657 80
                              L810 80"
                  />

                  <path
                    d="M857 80
                              L870 80"
                  />
                </g>

                <!-- ========================= -->
                <!-- Decoration 1 -->
                <!-- ========================= -->

                <g id="decorGroup1">
                  <line class="dash" x1="318" y1="76" x2="326" y2="84" />
                  <line class="dash" x1="330" y1="76" x2="338" y2="84" />
                  <line class="dash" x1="342" y1="76" x2="350" y2="84" />
                </g>

                <!-- ========================= -->
                <!-- Decoration 2 -->
                <!-- ========================= -->

                <g id="decorGroup2">
                  <line class="dash" x1="618" y1="76" x2="626" y2="84" />
                  <line class="dash" x1="630" y1="76" x2="638" y2="84" />
                  <line class="dash" x1="642" y1="76" x2="650" y2="84" />
                </g>

                <!-- ========================= -->
                <!-- Decoration 3 -->
                <!-- ========================= -->

                <g id="decorGroup3">
                  <line class="dash" x1="818" y1="76" x2="826" y2="84" />
                  <line class="dash" x1="830" y1="76" x2="838" y2="84" />
                  <line class="dash" x1="842" y1="76" x2="850" y2="84" />
                </g>

                <!-- ========================= -->
                <!-- Terminal -->
                <!-- ========================= -->

                <g id="terminalNode">
                  <circle id="terminalOuter" cx="885" cy="80" r="8" />

                  <circle id="terminalInner" cx="885" cy="80" r="3" />
                </g>
                <circle id="energyPulse" r="4" cx="20" cy="145" />
                <path
                  id="pulsePath"
                  d="
                              M20 145
                              L200 145
                              L300 80
                              L870 80
                          "
                  fill="none"
                  stroke="none"
                />
                <line id="flowPulse" x1="-8" y1="0" x2="8" y2="0" />
              </svg>
            </div>

            <div id="navigatorLabels">
              <div class="header">
                <span>CONTACT</span>
                <span id="navigatorButton">NAVIGATOR</span>
              </div>

              <div class="menu">
                <div class="navItem">HOME</div>
                <div class="navItem">ABOUT</div>
                <div class="navItem">PROJECTS</div>
                <div class="navItem">SKILLS</div>
              </div>
            </div>
          </div>
        </div>

        <div class="scanner">
          <div class="radar">
            <div class="sweep"></div>
            <svg class="radarDots" viewBox="0 0 200 200"></svg>
          </div>

          <svg class="panel" viewBox="0 0 900 500" preserveAspectRatio="none">
            <defs>
              <linearGradient id="glass">
                <stop offset="0%" stop-color="#8fe9ff22" />
                <stop offset="100%" stop-color="#8fe9ff08" />
              </linearGradient>
            </defs>

            <path
              class="glass"
              d="
                M 90 20
                L 400 20
                L 460 60
                L 860 60
                L 880 90
                L 880 420
                A 30 30 0 0 1 850 450
                L 620 450
                L 560 420
                L 320 420
                L 280 450
                L 60 450
                A 40 50 0 0 1 20 400
                L 20 90
                Z
            "
            />

            <path
              class="border"
              d="
                M 90 20
                L 400 20
                L 460 60
                L 860 60
                L 880 90
                L 880 420
                A 30 30 0 0 1 850 450
                L 620 450
                L 560 420
                L 320 420
                L 280 450
                L 60 450
                A 40 50 0 0 1 20 400
                L 20 90
                Z
            "
            />
          </svg>
          <div class="scanningText">
            <div class="loader">
              <span class="scanText"></span>
              <span class="dots"></span>
            </div>

            <div class="found">
              <div class="foundText">Found!</div>
              <div class="entityName">Entity Name:</div>
              <div class="message">Message: Who Am I?</div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div id="infoPanel" class="info-panel">
      <div class="info-panel-header">
        <span class="info-panel-title">Title</span>
        <button class="info-panel-close" aria-label="Close">&times;</button>
      </div>
      <div class="info-panel-body"></div>
    </div>

    <script src="navigation/navigation.js"></script>
    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.179.1/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.179.1/examples/jsm/"
        }
      }
    </script>
    <script type="module" src="main_Logic/script.js"></script>
  </body>
</html>
